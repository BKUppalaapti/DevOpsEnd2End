apiVersion: apps/v1
kind: Deployment
metadata:
  name: story-app
  namespace: default
  labels:
    app: story-app
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: story-app
  template:
    metadata:
      labels:
        app: story-app
        version: v1
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # Pod anti-affinity for better distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - story-app
                topologyKey: kubernetes.io/hostname

      # Service account
      serviceAccountName: default

      # Init container to ensure PV directory exists
      initContainers:
        - name: setup
          image: busybox:1.35
          command: ['sh', '-c', 'mkdir -p /app/stories && ls -la /app/stories']
          volumeMounts:
            - name: stories-volume
              mountPath: /app/stories

      # Application container
      containers:
        - name: story-app
          image: balauppalapati/story-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: FLASK_ENV
              value: "production"
            - name: PYTHONUNBUFFERED
              value: "1"

          # Resource requests and limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Liveness probe - ensures container is alive
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness probe - ensures container is ready for traffic
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          # Volume mounts
          volumeMounts:
            - name: stories-volume
              mountPath: /app/stories

          # Security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      # Volumes
      volumes:
        - name: stories-volume
          persistentVolumeClaim:
            claimName: story-pvc

      # Pod security context
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Restart policy
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
