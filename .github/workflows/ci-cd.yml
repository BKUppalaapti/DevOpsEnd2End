name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app.py'
      - 'templates/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/ci-cd.yml'
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'templates/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'k8s/**'

env:
  REGISTRY: docker.io
  IMAGE_NAME: balauppalapati/story-app
  IMAGE_TAG: latest

jobs:
  # Linting and code quality checks
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint

      - name: Run Flake8 linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Run Pylint
        run: |
          pylint app.py --disable=all --enable=E,F --exit-zero
        continue-on-error: true

  # Security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security check
        run: |
          bandit -r app.py -f json -o bandit-report.json || true
          bandit -r app.py || true
        continue-on-error: true

      - name: Check dependencies for known vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check --json || true
        continue-on-error: true

      - name: Dockerfile linting with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3009,DL4006
        continue-on-error: true

  # Docker build verification
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verification only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Docker build, push, and deploy (only on merge to main)
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Verify image on Docker Hub
        run: |
          echo "Docker image successfully pushed to:"
          echo "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # Notification
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [lint, security, docker-build, deploy]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Job Status Summary
        run: |
          echo "=== CI/CD Pipeline Summary ==="
          echo "Lint Status: ${{ needs.lint.result }}"
          echo "Security Status: ${{ needs.security.result }}"
          echo "Docker Build Status: ${{ needs.docker-build.result }}"
          echo "Deploy Status: ${{ needs.deploy.result }}"
          echo ""
          echo "Next steps:"
          echo "1. Pull the image on your local Windows machine"
          echo "2. Run 'deploy-local.ps1' to deploy to your local kubeadm cluster"
